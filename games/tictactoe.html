<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tic-Tac-Toe · Charlotte Arcade</title>
<link rel="stylesheet" href="../shared.css" />
<style>
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: 100%;
    max-width: 360px;
    background: var(--screen-bg);
    border-radius: 20px;
    padding: 12px;
    box-shadow: 0 16px 40px rgba(27, 27, 51, 0.18);
  }

  .cell {
    position: relative;
    aspect-ratio: 1 / 1;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(2rem, 10vw, 3.4rem);
    font-weight: 800;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    user-select: none;
  }

  .cell:not(.filled):hover {
    background: rgba(255,255,255,0.1);
    box-shadow: 0 0 16px rgba(123, 47, 247, 0.4);
  }

  .cell.x { color: var(--accent-3); text-shadow: 0 0 14px rgba(0,229,255,0.6); }
  .cell.o { color: var(--accent); text-shadow: 0 0 14px rgba(255,61,127,0.6); }

  .cell.pop { animation: pop 0.25s cubic-bezier(.34,1.56,.64,1); }

  @keyframes pop {
    from { transform: scale(0.4); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .cell.win {
    background: rgba(57, 255, 176, 0.15);
    box-shadow: inset 0 0 0 2px var(--win), 0 0 20px rgba(57,255,176,0.5);
  }

  .status {
    margin-top: 16px;
    color: var(--muted);
    min-height: 1.2em;
    text-align: center;
  }

  .status.thinking::after {
    content: "…";
    animation: dots 1s steps(4) infinite;
  }

  @keyframes dots {
    0% { content: "."; }
    33% { content: ".."; }
    66% { content: "..."; }
    100% { content: "."; }
  }
</style>
</head>
<body>

<div class="aurora"><span></span><span></span><span></span></div>
<canvas id="fx"></canvas>

<div class="topbar">
  <a class="back btn icon" href="../index.html">←</a>
</div>

<h1>⭕ Tic-Tac-Toe</h1>
<p class="subtitle">You're X. Beat the AI if you can.</p>

<div class="panel">
  <div class="stat">
    <div class="label">Wins</div>
    <div class="value" id="wins">0</div>
  </div>
  <div class="stat">
    <div class="label">Losses</div>
    <div class="value" id="losses">0</div>
  </div>
  <div class="stat">
    <div class="label">Draws</div>
    <div class="value" id="draws">0</div>
  </div>
  <select id="difficulty">
    <option value="easy">Easy</option>
    <option value="medium">Medium</option>
    <option value="hard" selected>Unbeatable</option>
  </select>
  <button class="primary" id="restart">New Round</button>
  <button class="icon" id="mute" title="Toggle sound">🔊</button>
</div>

<div class="board" id="board"></div>
<p class="status" id="status">Your move.</p>

<footer>Your win/loss/draw record is saved locally in this browser.</footer>

<script src="../shared.js"></script>
<script>
(function () {
  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const winsEl = document.getElementById('wins');
  const lossesEl = document.getElementById('losses');
  const drawsEl = document.getElementById('draws');
  const difficultySel = document.getElementById('difficulty');
  const restartBtn = document.getElementById('restart');

  const RECORD_KEY = 'arcade-ttt-record';
  const LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  let cells, board, gameOver, record;

  function loadRecord() {
    try {
      return JSON.parse(localStorage.getItem(RECORD_KEY)) || { w: 0, l: 0, d: 0 };
    } catch (e) {
      return { w: 0, l: 0, d: 0 };
    }
  }

  function saveRecord() {
    localStorage.setItem(RECORD_KEY, JSON.stringify(record));
  }

  function refreshRecordUI() {
    winsEl.textContent = record.w;
    lossesEl.textContent = record.l;
    drawsEl.textContent = record.d;
  }

  function buildBoard() {
    boardEl.innerHTML = '';
    cells = [];
    for (let i = 0; i < 9; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.addEventListener('click', () => onCellClick(i));
      boardEl.appendChild(cell);
      cells.push(cell);
    }
  }

  function winner(b) {
    for (const [a, c, d] of LINES) {
      if (b[a] && b[a] === b[c] && b[a] === b[d]) return { player: b[a], line: [a, c, d] };
    }
    if (b.every(v => v)) return { player: 'draw', line: [] };
    return null;
  }

  function emptyIndices(b) {
    return b.map((v, i) => v ? -1 : i).filter(i => i >= 0);
  }

  function minimax(b, depth, isMax) {
    const result = winner(b);
    if (result) {
      if (result.player === 'O') return 10 - depth;
      if (result.player === 'X') return depth - 10;
      return 0;
    }
    if (isMax) {
      let best = -Infinity;
      for (const i of emptyIndices(b)) {
        b[i] = 'O';
        best = Math.max(best, minimax(b, depth + 1, false));
        b[i] = null;
      }
      return best;
    } else {
      let best = Infinity;
      for (const i of emptyIndices(b)) {
        b[i] = 'X';
        best = Math.min(best, minimax(b, depth + 1, true));
        b[i] = null;
      }
      return best;
    }
  }

  function bestMove() {
    let best = -Infinity, move = -1;
    for (const i of emptyIndices(board)) {
      board[i] = 'O';
      const val = minimax(board, 0, false);
      board[i] = null;
      if (val > best) { best = val; move = i; }
    }
    return move;
  }

  function aiMove() {
    const level = difficultySel.value;
    const empties = emptyIndices(board);
    let move;

    if (level === 'easy') {
      move = empties[Math.floor(Math.random() * empties.length)];
    } else if (level === 'medium') {
      move = Math.random() < 0.55 ? bestMove() : empties[Math.floor(Math.random() * empties.length)];
    } else {
      move = bestMove();
    }

    board[move] = 'O';
    renderCell(move);
    Arcade.sfxFlip();
    checkEnd();
  }

  function renderCell(i) {
    const cell = cells[i];
    cell.textContent = board[i];
    cell.classList.add('filled', board[i].toLowerCase(), 'pop');
    setTimeout(() => cell.classList.remove('pop'), 250);
  }

  function cellCenter(i) {
    const r = cells[i].getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  function checkEnd() {
    const result = winner(board);
    if (!result) {
      statusEl.textContent = gameOver ? statusEl.textContent : "Your move.";
      return;
    }
    gameOver = true;
    statusEl.classList.remove('thinking');

    if (result.player === 'draw') {
      statusEl.textContent = "It's a draw.";
      record.d++;
      Arcade.sfxMiss();
    } else {
      result.line.forEach(i => cells[i].classList.add('win'));
      if (result.player === 'X') {
        statusEl.textContent = 'You win! 🎉';
        record.w++;
        const c = cellCenter(result.line[1]);
        Arcade.spawnBurst(c.x, c.y);
        Arcade.sfxWin();
      } else {
        statusEl.textContent = 'AI wins.';
        record.l++;
        Arcade.sfxGameOver();
      }
    }
    saveRecord();
    refreshRecordUI();
  }

  function onCellClick(i) {
    if (gameOver || board[i]) return;
    board[i] = 'X';
    renderCell(i);
    Arcade.sfxFlip();
    checkEnd();
    if (gameOver) return;

    statusEl.textContent = 'AI thinking';
    statusEl.classList.add('thinking');
    setTimeout(() => {
      if (gameOver) return;
      aiMove();
      if (!gameOver) {
        statusEl.classList.remove('thinking');
        statusEl.textContent = 'Your move.';
      }
    }, 450);
  }

  function newRound() {
    board = Array(9).fill(null);
    gameOver = false;
    buildBoard();
    statusEl.classList.remove('thinking');
    statusEl.textContent = 'Your move.';
  }

  record = loadRecord();
  refreshRecordUI();
  restartBtn.addEventListener('click', newRound);
  difficultySel.addEventListener('change', newRound);
  Arcade.setupMuteButton(document.getElementById('mute'));

  newRound();
})();
</script>

</body>
</html>
