<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2048 · Charlotte Arcade</title>
<link rel="stylesheet" href="../shared.css" />
<style>
  .stage {
    width: 100%;
    max-width: 440px;
  }

  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--screen-bg);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 20px;
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
    box-shadow: 0 16px 40px rgba(27, 27, 51, 0.18);
    touch-action: none;
  }

  .cell-bg {
    background: rgba(255,255,255,0.06);
    border-radius: 10px;
  }

  .tile {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-weight: 800;
    color: #fff;
    transition: left 0.12s ease, top 0.12s ease;
    animation: tileIn 0.15s ease;
  }

  @keyframes tileIn {
    from { transform: scale(0.5); opacity: 0.4; }
    to { transform: scale(1); opacity: 1; }
  }

  .tile.merged {
    animation: tileMerge 0.2s ease;
  }

  @keyframes tileMerge {
    0% { transform: scale(1); }
    50% { transform: scale(1.18); }
    100% { transform: scale(1); }
  }

  .hint {
    color: var(--muted);
    font-size: 0.8rem;
    text-align: center;
    margin-top: 14px;
  }
</style>
</head>
<body>

<div class="aurora"><span></span><span></span><span></span></div>
<canvas id="fx"></canvas>

<div class="topbar">
  <a class="back btn icon" href="../index.html">←</a>
</div>

<h1>🔢 2048</h1>
<p class="subtitle">Arrow keys, WASD, or swipe. Merge matching tiles to reach 2048.</p>

<div class="panel">
  <div class="stat">
    <div class="label">Score</div>
    <div class="value" id="score">0</div>
  </div>
  <div class="stat">
    <div class="label">Best</div>
    <div class="value" id="best">0</div>
  </div>
  <button class="primary" id="restart">New Game</button>
  <button class="icon" id="mute" title="Toggle sound">🔊</button>
</div>

<div class="stage">
  <div class="board" id="board"></div>
  <p class="hint">Tip: keep your biggest tile in a corner.</p>
</div>

<div class="banner" id="winBanner">
  <h2>🎉 2048!</h2>
  <p id="winStats"></p>
  <button class="primary" id="keepGoing">Keep Going</button>
</div>

<div class="banner lose" id="overBanner">
  <h2>No more moves</h2>
  <p id="overStats"></p>
  <button class="primary" id="playAgain">Try Again</button>
</div>

<footer>Your best score is saved locally in this browser.</footer>

<script src="../shared.js"></script>
<script>
(function () {
  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const restartBtn = document.getElementById('restart');
  const winBanner = document.getElementById('winBanner');
  const winStats = document.getElementById('winStats');
  const overBanner = document.getElementById('overBanner');
  const overStats = document.getElementById('overStats');
  const keepGoingBtn = document.getElementById('keepGoing');
  const playAgainBtn = document.getElementById('playAgain');

  const SIZE = 4;
  const BEST_KEY = 'arcade-2048-best';
  const TILE_COLORS = {
    2: '#3a3a5c', 4: '#4a4a7c', 8: '#7b2ff7', 16: '#9b4ff7',
    32: '#ff3d7f', 64: '#ff6b3d', 128: '#ffb13d', 256: '#ffd93d',
    512: '#39ffb0', 1024: '#00e5ff', 2048: '#ffffff'
  };

  let grid, score, best, won, locked, cellSize, gap, pad;

  function loadBest() {
    return parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
  }

  function saveBestIfBetter() {
    const prev = loadBest();
    if (score > prev) {
      localStorage.setItem(BEST_KEY, String(score));
      return true;
    }
    return false;
  }

  function emptyGrid() {
    return Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  }

  function randomEmptyCell() {
    const empties = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c] === 0) empties.push([r, c]);
    if (!empties.length) return null;
    return empties[Math.floor(Math.random() * empties.length)];
  }

  function spawnTile() {
    const cell = randomEmptyCell();
    if (!cell) return;
    grid[cell[0]][cell[1]] = Math.random() < 0.9 ? 2 : 4;
  }

  function measureBoard() {
    const r = boardEl.getBoundingClientRect();
    pad = 10;
    gap = 10;
    cellSize = (r.width - pad * 2 - gap * (SIZE - 1)) / SIZE;
  }

  function renderBackground() {
    boardEl.querySelectorAll('.cell-bg').forEach(n => n.remove());
    for (let i = 0; i < SIZE * SIZE; i++) {
      const bg = document.createElement('div');
      bg.className = 'cell-bg';
      boardEl.appendChild(bg);
    }
  }

  function render(mergedCells, newCells) {
    boardEl.querySelectorAll('.tile').forEach(n => n.remove());
    measureBoard();
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const val = grid[r][c];
        if (!val) continue;
        const tile = document.createElement('div');
        tile.className = 'tile';
        const isMerged = mergedCells.some(m => m[0] === r && m[1] === c);
        const isNew = newCells.some(n => n[0] === r && n[1] === c);
        if (isMerged) tile.classList.add('merged');
        tile.style.width = cellSize + 'px';
        tile.style.height = cellSize + 'px';
        tile.style.left = (pad + c * (cellSize + gap)) + 'px';
        tile.style.top = (pad + r * (cellSize + gap)) + 'px';
        tile.style.background = TILE_COLORS[val] || '#ffffff';
        tile.style.color = val <= 4 ? '#f4f4ff' : (val >= 256 ? '#101018' : '#ffffff');
        tile.style.fontSize = (val >= 1000 ? cellSize * 0.32 : cellSize * 0.4) + 'px';
        tile.textContent = val;
        boardEl.appendChild(tile);
        if (isNew) Arcade.sfxFlip();
      }
    }
  }

  function slideLine(line) {
    const filtered = line.filter(v => v !== 0);
    const merged = [];
    let gained = 0;
    for (let i = 0; i < filtered.length; i++) {
      if (filtered[i] === filtered[i + 1]) {
        const val = filtered[i] * 2;
        merged.push(val);
        gained += val;
        i++;
      } else {
        merged.push(filtered[i]);
      }
    }
    while (merged.length < SIZE) merged.push(0);
    return { line: merged, gained };
  }

  function move(dir) {
    if (locked) return;
    const before = JSON.stringify(grid);
    let gained = 0;

    const rotated = toLines(dir);
    const results = rotated.map(slideLine);
    results.forEach(r => gained += r.gained);
    fromLines(dir, results.map(r => r.line));

    const after = JSON.stringify(grid);
    if (before === after) return;

    score += gained;
    scoreEl.textContent = score;
    if (gained > 0) Arcade.sfxMatch(Math.min(5, Math.floor(gained / 32)));

    const newCellBefore = randomEmptyCell();
    spawnTile();
    const newCells = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (grid[r][c] !== 0 && JSON.parse(before)[r][c] === 0) newCells.push([r, c]);

    render([], newCells);

    if (!won && grid.some(row => row.some(v => v >= 2048))) {
      won = true;
      locked = true;
      const isNewBest = saveBestIfBetter();
      bestEl.textContent = loadBest();
      winStats.textContent = `Score: ${score}${isNewBest ? ' · new best! 🏆' : ''}`;
      winBanner.classList.add('show');
      Arcade.spawnConfetti();
      Arcade.sfxWin();
      return;
    }

    if (!hasMoves()) {
      locked = true;
      const isNewBest = saveBestIfBetter();
      bestEl.textContent = loadBest();
      overStats.textContent = `Final score: ${score}${isNewBest ? ' · new best! 🏆' : ''}`;
      overBanner.classList.add('show');
      Arcade.sfxGameOver();
    }
  }

  function toLines(dir) {
    const lines = [];
    if (dir === 'left') {
      for (let r = 0; r < SIZE; r++) lines.push(grid[r].slice());
    } else if (dir === 'right') {
      for (let r = 0; r < SIZE; r++) lines.push(grid[r].slice().reverse());
    } else if (dir === 'up') {
      for (let c = 0; c < SIZE; c++) lines.push(grid.map(row => row[c]));
    } else {
      for (let c = 0; c < SIZE; c++) lines.push(grid.map(row => row[c]).reverse());
    }
    return lines;
  }

  function fromLines(dir, lines) {
    if (dir === 'left') {
      for (let r = 0; r < SIZE; r++) grid[r] = lines[r];
    } else if (dir === 'right') {
      for (let r = 0; r < SIZE; r++) grid[r] = lines[r].slice().reverse();
    } else if (dir === 'up') {
      for (let c = 0; c < SIZE; c++) for (let r = 0; r < SIZE; r++) grid[r][c] = lines[c][r];
    } else {
      for (let c = 0; c < SIZE; c++) {
        const col = lines[c].slice().reverse();
        for (let r = 0; r < SIZE; r++) grid[r][c] = col[r];
      }
    }
  }

  function hasMoves() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (grid[r][c] === 0) return true;
        if (c < SIZE - 1 && grid[r][c] === grid[r][c + 1]) return true;
        if (r < SIZE - 1 && grid[r][c] === grid[r + 1][c]) return true;
      }
    }
    return false;
  }

  function newGame() {
    grid = emptyGrid();
    score = 0;
    won = false;
    locked = false;
    scoreEl.textContent = '0';
    bestEl.textContent = loadBest();
    winBanner.classList.remove('show');
    overBanner.classList.remove('show');
    renderBackground();
    spawnTile();
    spawnTile();
    render([], []);
  }

  document.addEventListener('keydown', (e) => {
    const map = {
      ArrowLeft: 'left', a: 'left', A: 'left',
      ArrowRight: 'right', d: 'right', D: 'right',
      ArrowUp: 'up', w: 'up', W: 'up',
      ArrowDown: 'down', s: 'down', S: 'down'
    };
    if (map[e.key]) {
      e.preventDefault();
      move(map[e.key]);
    }
  });

  let touchStart = null;
  boardEl.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  boardEl.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) > 20) {
      if (Math.abs(dx) > Math.abs(dy)) {
        move(dx > 0 ? 'right' : 'left');
      } else {
        move(dy > 0 ? 'down' : 'up');
      }
    }
    touchStart = null;
  }, { passive: true });

  restartBtn.addEventListener('click', newGame);
  playAgainBtn.addEventListener('click', newGame);
  keepGoingBtn.addEventListener('click', () => {
    locked = false;
    winBanner.classList.remove('show');
  });
  Arcade.setupMuteButton(document.getElementById('mute'));
  window.addEventListener('resize', () => render([], []));

  newGame();
})();
</script>

</body>
</html>
