<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Memory Match · Charlotte Arcade</title>
<link rel="stylesheet" href="../shared.css" />
<style>
  .board {
    display: grid;
    gap: 10px;
    perspective: 1000px;
    width: 100%;
    max-width: 560px;
  }

  .card {
    position: relative;
    aspect-ratio: 1 / 1;
    cursor: pointer;
  }

  .card-inner {
    position: absolute;
    inset: 0;
    transition: transform 0.45s cubic-bezier(.34, 1.56, .64, 1);
    transform-style: preserve-3d;
  }

  .card:not(.flipped):not(.matched):hover .card-inner {
    transform: scale(1.06) rotateZ(-1deg);
  }

  .card.flipped .card-inner, .card.matched .card-inner {
    transform: rotateY(180deg);
  }

  .face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    backface-visibility: hidden;
    font-size: clamp(1.4rem, 5vw, 2.2rem);
    user-select: none;
  }

  .face.back {
    background: linear-gradient(145deg, var(--card-back), #2a1f55);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1), 0 4px 14px rgba(0,0,0,0.3);
  }

  .face.back::after {
    content: "✦";
    color: rgba(255,255,255,0.2);
    font-size: 1.5rem;
  }

  .card:not(.flipped):not(.matched):hover .face.back {
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15), 0 0 20px rgba(0, 229, 255, 0.45);
  }

  .face.front {
    background: #1a1a33;
    transform: rotateY(180deg);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.15));
  }

  .card.matched .face.front {
    background: radial-gradient(circle, #163b31, #0f2a24);
    box-shadow: inset 0 0 0 2px var(--win), 0 0 22px rgba(57, 255, 176, 0.55);
    animation: matchPulse 0.5s ease;
  }

  @keyframes matchPulse {
    0% { transform: rotateY(180deg) scale(1); }
    50% { transform: rotateY(180deg) scale(1.12); }
    100% { transform: rotateY(180deg) scale(1); }
  }

  .card.mismatch .card-inner {
    animation: shake 0.4s;
  }

  @keyframes shake {
    0%, 100% { transform: rotateY(180deg) translateX(0); }
    25% { transform: rotateY(180deg) translateX(-6px); }
    75% { transform: rotateY(180deg) translateX(6px); }
  }
</style>
</head>
<body>

<div class="aurora"><span></span><span></span><span></span></div>
<canvas id="fx"></canvas>

<div class="topbar">
  <a class="back btn icon" href="../index.html">←</a>
</div>

<h1>🧠 Memory Match</h1>
<p class="subtitle">Flip two cards. Chain matches for combo bonus points. Beat your best.</p>

<div class="panel">
  <div class="stat">
    <div class="label">Score</div>
    <div class="value" id="score">0</div>
  </div>
  <div class="stat">
    <div class="label">Moves</div>
    <div class="value" id="moves">0</div>
  </div>
  <div class="stat">
    <div class="label">Time</div>
    <div class="value" id="timer">0:00</div>
  </div>
  <div class="stat" id="streakStat">
    <div class="label">Streak</div>
    <div class="value" id="streak">0</div>
  </div>
  <div class="stat">
    <div class="label">Best</div>
    <div class="value" id="best">--:--</div>
  </div>
  <select id="difficulty">
    <option value="4">Easy (4x4)</option>
    <option value="5">Medium (5x4)</option>
    <option value="6" selected>Hard (6x5)</option>
  </select>
  <button class="primary" id="restart">New Game</button>
  <button class="icon" id="mute" title="Toggle sound">🔊</button>
</div>

<div class="board" id="board"></div>

<div class="banner" id="winBanner">
  <h2>🎉 You win!</h2>
  <p id="winStats"></p>
</div>

<footer>Pairs shuffle every game. Your best time per difficulty is saved locally.</footer>

<script src="../shared.js"></script>
<script>
(function () {
  const EMOJI_POOL = ['🍎','🍌','🍇','🍉','🍓','🍒','🍍','🥝','🥑','🍑','🌶️','🥕','🍄','🌽','🍔','🍕','🌮','🍣','🍩','🍪','🎲','🎮','🚀','⚽','🏀','🎸','🎧','🎯','🐙','🦄','🐸','🦊'];

  const boardEl = document.getElementById('board');
  const movesEl = document.getElementById('moves');
  const timerEl = document.getElementById('timer');
  const bestEl = document.getElementById('best');
  const scoreEl = document.getElementById('score');
  const streakEl = document.getElementById('streak');
  const streakStatEl = document.getElementById('streakStat');
  const difficultySel = document.getElementById('difficulty');
  const restartBtn = document.getElementById('restart');
  const winBanner = document.getElementById('winBanner');
  const winStats = document.getElementById('winStats');

  let cols = 6;
  let rows = 5;
  let cards = [];
  let flipped = [];
  let matchedCount = 0;
  let moves = 0;
  let lockBoard = false;
  let seconds = 0;
  let timerHandle = null;
  let started = false;
  let score = 0;
  let streak = 0;

  function dims(level) {
    if (level === '4') return { cols: 4, rows: 4 };
    if (level === '5') return { cols: 5, rows: 4 };
    return { cols: 6, rows: 5 };
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${m}:${sec.toString().padStart(2, '0')}`;
  }

  function bestKey() {
    return `memory-match-best-${cols}x${rows}`;
  }

  function loadBest() {
    const v = localStorage.getItem(bestKey());
    bestEl.textContent = v ? formatTime(parseInt(v, 10)) : '--:--';
  }

  function saveBestIfBetter() {
    const key = bestKey();
    const prev = localStorage.getItem(key);
    if (!prev || seconds < parseInt(prev, 10)) {
      localStorage.setItem(key, String(seconds));
      loadBest();
      return true;
    }
    return false;
  }

  function stopTimer() {
    if (timerHandle) {
      clearInterval(timerHandle);
      timerHandle = null;
    }
  }

  function startTimer() {
    stopTimer();
    seconds = 0;
    timerEl.textContent = formatTime(seconds);
    timerHandle = setInterval(() => {
      seconds++;
      timerEl.textContent = formatTime(seconds);
    }, 1000);
  }

  function buildDeck() {
    const total = cols * rows;
    const pairCount = total / 2;
    const chosen = shuffle(EMOJI_POOL.slice()).slice(0, pairCount);
    const deck = shuffle(chosen.concat(chosen));
    return deck;
  }

  function render() {
    boardEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    boardEl.innerHTML = '';
    cards.forEach((symbol, idx) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.index = idx;
      card.innerHTML = `
        <div class="card-inner">
          <div class="face back"></div>
          <div class="face front">${symbol}</div>
        </div>
      `;
      card.addEventListener('click', () => onCardClick(card, idx));
      boardEl.appendChild(card);
    });
  }

  function setStreak(val) {
    streak = val;
    streakEl.textContent = streak;
    streakStatEl.classList.toggle('hot', streak >= 2);
  }

  function addScore(points) {
    score += points;
    scoreEl.textContent = score;
  }

  function cardCenter(el) {
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  function onCardClick(cardEl, idx) {
    if (lockBoard) return;
    if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;

    if (!started) {
      started = true;
      startTimer();
    }

    cardEl.classList.add('flipped');
    flipped.push({ el: cardEl, idx });
    Arcade.sfxFlip();

    if (flipped.length === 2) {
      moves++;
      movesEl.textContent = moves;
      lockBoard = true;
      const [a, b] = flipped;
      const isMatch = cards[a.idx] === cards[b.idx];

      if (isMatch) {
        setTimeout(() => {
          a.el.classList.add('matched');
          b.el.classList.add('matched');
          const ca = cardCenter(a.el);
          const cb = cardCenter(b.el);
          Arcade.spawnBurst(ca.x, ca.y);
          Arcade.spawnBurst(cb.x, cb.y);
          setStreak(streak + 1);
          Arcade.sfxMatch(streak);
          addScore(100 + streak * 25);
          matchedCount += 2;
          flipped = [];
          lockBoard = false;
          checkWin();
        }, 350);
      } else {
        a.el.classList.add('mismatch');
        b.el.classList.add('mismatch');
        setStreak(0);
        Arcade.sfxMiss();
        setTimeout(() => {
          a.el.classList.remove('flipped', 'mismatch');
          b.el.classList.remove('flipped', 'mismatch');
          flipped = [];
          lockBoard = false;
        }, 800);
      }
    }
  }

  function checkWin() {
    if (matchedCount === cards.length) {
      stopTimer();
      const isNewBest = saveBestIfBetter();
      const timeBonus = Math.max(0, 300 - seconds) * 2;
      addScore(timeBonus);
      winStats.textContent = `${moves} moves · ${formatTime(seconds)} · score ${score}${isNewBest ? ' · new best time! 🏆' : ''}`;
      winBanner.classList.add('show');
      Arcade.spawnConfetti();
      Arcade.sfxWin();
    }
  }

  function newGame() {
    const level = dims(difficultySel.value);
    cols = level.cols;
    rows = level.rows;
    cards = buildDeck();
    flipped = [];
    matchedCount = 0;
    moves = 0;
    lockBoard = false;
    started = false;
    score = 0;
    movesEl.textContent = '0';
    scoreEl.textContent = '0';
    setStreak(0);
    stopTimer();
    seconds = 0;
    timerEl.textContent = formatTime(0);
    winBanner.classList.remove('show');
    loadBest();
    render();
  }

  restartBtn.addEventListener('click', newGame);
  difficultySel.addEventListener('change', newGame);
  Arcade.setupMuteButton(document.getElementById('mute'));

  newGame();
})();
</script>

</body>
</html>
